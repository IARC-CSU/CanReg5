name: Build and Release Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows, macOS & Linux Installers
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Set up Node.js (for jDeploy)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from Git tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG_NAME}" =~ (BETA|RC|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync version into appinfo.properties
        run: |
          sed -i '' "s/^program\.VERSION=.*/program.VERSION=${{ steps.version.outputs.version }}/" appinfo.properties

      - name: Run Unit Tests
        run: ant test -Drun.jvmargs="-Djava.awt.headless=true"

      - name: Show Test Failures
        if: failure()
        run: |
          for f in build/test/results/*.txt; do
            if grep -E "FAILURE|ERROR" "$f" > /dev/null 2>&1; then
              echo "=========================================="
              echo "FAILED: $f"
              echo "=========================================="
              cat "$f"
            fi
          done

      - name: Build JAR and Platform Distributions
        run: ant jar

      - name: Collect Release Assets
        run: |
          mkdir -p release-assets
          cp dist/web/CanReg5-Windows.zip release-assets/
          if [ -f dist/web/CanReg5-Windows-with-R.zip ]; then
            cp dist/web/CanReg5-Windows-with-R.zip release-assets/
          fi
          cp dist/web/CanReg5-macOS.zip release-assets/
          cp dist/web/CanReg5-Linux.zip release-assets/
          cp dist/web/CanReg5-R-packages.zip release-assets/
          cp dist/translations.zip release-assets/
          for f in jdeploy/installers/*; do
            if [ -f "$f" ] && [[ "$f" != *win* ]]; then
              cp "$f" release-assets/
            fi
          done
          ls -lh release-assets/

      - name: Create GitHub Release and Attach Installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CanReg5 ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*

  build-windows-installers:
    name: Build Windows Native Installers (Inno Setup)
    runs-on: windows-latest
    needs: build-and-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Extract version from Git tag
        id: version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync version into appinfo.properties & inno-settings.txt
        shell: bash
        run: |
          sed -i "s/^program\.VERSION=.*/program.VERSION=${{ steps.version.outputs.version }}/" appinfo.properties
          echo "#define MyAppVersion \"${{ steps.version.outputs.version }}\"" > inno-settings.txt

      - name: Build CanReg5 JAR and Distribution
        shell: cmd
        run: |
          ant jar

      - name: Build Standard Windows Installer (Inno Setup)
        shell: cmd
        run: |
          ISCC.exe /DCanReg5Dir=. helpers\InnoSetup\CanReg5-InnoSetup.iss

      - name: Build Standalone R Runtime
        shell: pwsh
        run: |
          ./scripts/build_r_bundle.ps1 -RVersion "4.3.3" -OutputDir "r-runtime"

      - name: Build Windows with R Installer (Inno Setup)
        shell: cmd
        run: |
          ISCC.exe /DCanReg5Dir=. /DRSourceDir=r-runtime helpers\InnoSetup\CanReg5-with-R-InnoSetup.iss

      - name: Package Windows with R Zip Distribution
        shell: cmd
        run: |
          ant -DhasRRuntime=true -package-windows-with-r

      - name: Prepare Windows Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-assets
          Compress-Archive -Path dist\CanReg5-Setup.exe -DestinationPath windows-assets\CanReg5-Setup.zip -Force
          Compress-Archive -Path dist\CanReg5-with-R-Setup.exe -DestinationPath windows-assets\CanReg5-with-R-Setup.zip -Force
          Copy-Item dist\CanReg5-Setup.exe windows-assets\
          Copy-Item dist\CanReg5-with-R-Setup.exe windows-assets\
          if (Test-Path dist\web\CanReg5-Windows-with-R.zip) {
            Copy-Item dist\web\CanReg5-Windows-with-R.zip windows-assets\
          }
          Get-ChildItem -Path windows-assets

      - name: Attach Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            windows-assets/*

